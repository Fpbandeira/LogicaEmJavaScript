<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pedir pro usuário dois números e depois devolver a média dos dois números<h1>

    <script>
      
     let n1 = prompt("Digite um número: ")
         n1 = Number(n1)
     let n2 = prompt("Digite outro Número: ")
         n2 = Number(n2)
     let media = (n1 + n2) / 2
     

    alert('A média desses números é igual a: ' + media + ".")

    </script>
</body>
</html>
