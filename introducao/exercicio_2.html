<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>pedir pro usuario digitar 2 números inteiros e mostrar soma, subtração,
        divisão e multiplicação.</h1>

        <script>
         let numero1 = prompt("Digite um número inteiro: ")
             numero1 = parseInt(numero1)
         let numero2 = prompt("Digite outro número inteiro: ")
             numero2 = parseInt(numero2)

          let soma = numero1 + numero2
          let subtracao = numero1 - numero2
          let divisao = numero1 / numero2
          let multiplicacao = numero1 * numero2
          
          alert('A soma é igual a:' + soma +".")

          alert("A Subtração é igual : " + subtracao + ".")

          alert("a Divisão é igual a: " + divisao + ".")

          alert("A multiplicação é igual a: " + multiplicacao + ".")

        </script>
</body>
</html>
