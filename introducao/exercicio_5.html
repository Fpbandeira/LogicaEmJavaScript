<body>
   
    <h1>Exercicio banana<h1>

   <script>   
    /*
    1. Crie uma variavel com texto "Ba".
    2. Sem criar outra variável, concatene com o resultado 
    da tentativa de converter essa váriavel em um número.
    3. Mostre na tela o valor dessa variável xoncatenando com a letra "a".
    */

     let str = "Ba"
     str += parseInt(str)
     alert((str + "a").toLocaleLowerCase())

   </script>
